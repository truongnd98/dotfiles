[general]
# Đường dẫn tuyệt đối: `./key_bindings.toml` phụ thuộc CWD của process
# alacritty, không phải vị trí file config.
import = [
  # "~/.config/alacritty/themes/themes/aura.toml",
  "~/.config/alacritty/key_bindings.toml",
]
live_config_reload = true

# Aura Theme for Alacritty Terminal
[colors.primary]
background = "#15141b"
foreground = "#edecee"

[colors.cursor]
cursor = "#a277ff"

# [colors.selection]
# text = "CellForeground"
# background = "#29263c"

[colors.normal]
black = "#110f18"
red = "#ff6767"
green = "#61ffca"
yellow = "#ffca85"
blue = "#a277ff"
magenta = "#a277ff"
cyan = "#61ffca"
white = "#edecee"

[colors.bright]
black = "#4d4d4d"
red = "#ff6767"
green = "#61ffca"
yellow = "#ffca85"
blue = "#a277ff"
magenta = "#a277ff"
cyan = "#61ffca"
white = "#edecee"

[env]
TERM = "alacritty"
# `LANG` chứ không phải `LC_ALL`: LC_ALL ghi đè MỌI locale category, kể cả
# LC_COLLATE - làm thứ tự `sort`, `ls`, glob khác với mặc định của hệ thống.
LANG = "en_US.UTF-8"

[font]
size = 14.0
offset = { x = 0, y = 2 }
glyph_offset = { x = 0, y = 0 }

# [font.bold]
# family = "JetBrainsMono Nerd Font"
# style = "Bold"
# 
# [font.bold_italic]
# family = "JetBrainsMono Nerd Font"
# style = "Bold Italic"
# 
# [font.italic]
# family = "JetBrainsMono Nerd Font"
# style = "Light Italic"
# 
# [font.normal]
# family = "JetBrainsMono Nerd Font"
# style = "Regular"

# Maple Mono
[font.bold]
family = "Maple Mono NF"
style = "Bold"

[font.bold_italic]
family = "Maple Mono NF"
style = "Bold Italic"

[font.italic]
family = "Maple Mono NF"
style = "Italic"

[font.normal]
family = "Maple Mono NF"
style = "Regular"

[window]
# decorations ="Buttonless"
decorations_theme_variant = "Dark"
startup_mode = "Maximized"
# dynamic_padding = true
opacity = 0.85
blur = true
option_as_alt ="Both"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 8
y = 8

[scrolling]
history = 2000
multiplier = 1

[cursor]
blink_interval = 500

[cursor.style]
blinking = "Always"

# Khối `[[keyboard.bindings]]` (Shift+Enter) đã chuyển sang key_bindings.toml
# để keyboard.bindings chỉ còn một nguồn.
